name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - data/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Full pipeline on the Contoso test data: mock API → collector → aggregator → Vite build, both scopes.
      - run: npm run testdata
